[package]
name = "desktop-pets"
version = "0.1.0"
description = "Mascotes animados para desktop"
authors = ["Desktop Pets"]
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5.3"
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
